<!-- SECTION 3: project -->
<section id="projects" class="project-grid-section">
    <h2>Projects</h2>

    <div class="grid-container">
        {% assign ordered_projects = site.projects | sort: 'order' %}
        {% for item in ordered_projects %}
    <a href="{{ item.url }}" class="project-link">
        <div class="project-card">
            {% if item.card_image %}
            <div class="card-image">
                <img src="{{ item.card_image }}" alt="{{ item.title }} highlight image">
            </div>
            {% endif %}
            <div class="card-text">
                <h3 class="project-title">{{ item.title }}</h3>
                <div class="project-skills">
                    {% for skill in item.skills %}
                        <span class="skill">{{ skill }}</span>
                    {% endfor %}
                </div>
                <p class="project-description">{{ item.description }}</p>
                <button class="read-more">Read more →</button>
            </div>
        </div>
    </a>
{% endfor %}
    </div>


 </section>
