# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Anthony Bianchi | Engineering Portfolio # This is what shows up in the tab of the browser



# Hero Section
name: Anthony Bianchi
headline: Computer Engineering @ NC State
description: >- # dont remove this line. this will ignore all new lines until the next section
  I'm Anthony Bianchi, a Computer Engineering undergrad at NC State working in digital chip design and embedded systems. I build real hardware — FPGAs, microcontrollers, PCBs, and 3D-printed everything — and everything I build solves a real problem. Currently hunting a Summer 2027 hardware internship.

# Place your profile image in /assets/images/profile-image/folder and edit the file name
profile_image: ./assets/images/profile-image/avatar.jpeg


# Link your resume — TODO: upload resume PDF to assets/resume/ and set this to /assets/resume/resume.pdf
# resume-url: /assets/resume/resume.pdf


# Set up external links - this will show up as small icons next to your name.

external-links:    # input only your own url slug. The icons with missing entries will not appear.
  linkedin: anthony-bianchi-jr    # https://www.linkedin.com/in/{your url slug}
  github: OmegaDraquex            # https://github.com/{your url slug}
  stackoverflow:
  medium:
  x-twitter:
  threads:
  instragram:
  youtube:
  discord:
  bluesky:


# Skills Section - Add the list of your Skills by categories/tools. The indentation for each level needs to be precise.
skills:
  - category: Languages & HDL
    tools:
    - Embedded C
    - C++
    - Verilog HDL
    - Bash
    - Assembly
    - MATLAB
  - category: Embedded & Digital Logic
    tools:
    - TI MSP430
    - ESP32
    - FPGAs (Gowin)
    - DAC / PWM / GPIO
    - TTL Logic
    - FSM Design
  - category: Fabrication & EDA
    tools:
    - SolidWorks
    - FDM 3D Printing
    - CNC PCB Milling
    - KiCad
    - SMT Pick-and-Place
    - Soldering (SMD & Through-Hole)
  - category: Lab & Tools
    tools:
    - Oscilloscopes
    - Logic Analyzers (Analog Discovery 3)
    - Digital Multimeters
    - Git
    - Linux


# Contact Form Setup. Setup an account and copy over the key. When someone fills out the form, it will be received in your email.
formspree-key:   https://formspree.io/f/{8-digit key}




